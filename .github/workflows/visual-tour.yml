name: Visual tour audit

on:
  pull_request:
  workflow_dispatch:

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install visual-test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libx11-6 libxcursor1 libxinerama1 libxi6
      - name: Install Godot 4.7.2
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import resources (placeholder mode, no private art)
        run: ./godot --headless --path . --import
      - name: Tour bot — new game, selected locations
        run: |
          mkdir -p /tmp/eotv-tour
          timeout 14m xvfb-run -a -s "-screen 0 1440x900x24" ./godot --path . --rendering-driver opengl3 res://tools/tour_bot.tscn -- --out=/tmp/eotv-tour --states=start --only=greyford_block,rook_storeroom,theo_new_room,north_quay,lighthouse_point 2>&1 | tee /tmp/eotv-tour/engine.log
          test -f /tmp/eotv-tour/report.json
          grep -q "TOUR DONE" /tmp/eotv-tour/engine.log
      - name: Summarize captures
        if: always()
        run: |
          python3 -m pip install --break-system-packages Pillow
          if test -f /tmp/eotv-tour/report.json; then
            python3 tools/tour_report.py /tmp/eotv-tour
          fi
      - name: Upload tour images, report and engine log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-visual-audit
          path: /tmp/eotv-tour/
          if-no-files-found: warn
          retention-days: 14
